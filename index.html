<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>防詐練習網</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --fs:20px; --bg:#f4f6f8; --card:#fff; --ink:#1a1a1a; --sub:#555; --line:#d5dbe0;
  --ok:#0a7a3d; --okbg:#e6f5ec; --bad:#b3261e; --badbg:#fdecea;
  --accent:#12507e; --accent2:#e8f0f7;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  font-size:var(--fs);line-height:1.9;}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 64px;}
header{background:var(--accent);color:#fff;padding:14px 0;}
.hdr{max-width:760px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.brand{font-size:1.15em;font-weight:700;}
.fontctl{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.8em;}
.fontctl button{background:#fff;color:var(--accent);border:none;border-radius:6px;
  width:38px;height:38px;font-size:16px;font-weight:700;cursor:pointer;}
.progress{background:var(--accent2);border-bottom:2px solid var(--line);}
.pg{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;}
.pg b{color:var(--accent);}
.bar{flex:1 1 200px;min-width:180px;height:16px;background:#fff;border:1px solid var(--line);
  border-radius:10px;overflow:hidden;}
.bar span{display:block;height:100%;background:var(--ok);width:0;transition:width .4s;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin:18px 0;}
.review{background:#fff8e6;border-left:6px solid #f0b429;border-radius:8px;padding:12px 14px;margin:12px 0;}
.review .main{margin-top:8px;}
.chkline{display:flex;gap:8px;align-items:flex-start;font-size:.92em;margin:10px 0;}
.chkline input{width:auto;margin-top:6px;}
h1{font-size:1.5em;margin:.2em 0 .6em;} h2{font-size:1.2em;margin:.2em 0 .5em;}
.muted{color:var(--sub);font-size:.85em;}
button.main{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:16px 26px;
  font-size:1em;font-family:inherit;cursor:pointer;width:100%;font-weight:700;margin-top:8px;}
button.main.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent);}
button.main:disabled{background:#9aa5ad;cursor:not-allowed;}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);
  border-radius:10px;padding:16px 18px;margin:10px 0;font-size:1em;font-family:inherit;
  cursor:pointer;line-height:1.7;}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent2);}
.opt:disabled{cursor:default;}
.opt.correct{border-color:var(--ok);background:var(--okbg);}
.opt.wrong{border-color:var(--bad);background:var(--badbg);}
.fb{border-radius:10px;padding:16px 18px;margin-top:14px;border-left:8px solid;}
.fb.good{background:var(--okbg);border-color:var(--ok);}
.fb.bad{background:var(--badbg);border-color:var(--bad);}
.fb .t{font-weight:700;margin-bottom:6px;}
.chat{background:#eef1f4;border-radius:12px;padding:14px;margin:12px 0;}
.msg{background:#fff;border-radius:14px;padding:12px 16px;margin:8px 0;max-width:88%;border:1px solid var(--line);}
.msg .who{font-size:.75em;color:var(--sub);margin-bottom:4px;}
.tier{display:inline-block;padding:4px 14px;border-radius:20px;background:#fff;color:var(--accent);
  font-weight:700;font-size:.8em;border:2px solid var(--accent);}
.cert{border:6px double var(--accent);border-radius:8px;padding:34px 24px;text-align:center;background:#fffdf7;}
.cert .lv{font-size:1.9em;font-weight:700;color:var(--accent);margin:14px 0;}
.locked{opacity:.55;}
table{width:100%;border-collapse:collapse;font-size:.85em;margin-top:10px;}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;}
th{background:var(--accent2);}
.row{display:flex;gap:10px;flex-wrap:wrap;} .row>*{flex:1 1 160px;}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.dot.on{background:#7ee2a8;} .dot.off{background:#f0a5a0;}
input,select{font-family:inherit;font-size:.9em;padding:12px;border:2px solid var(--line);
  border-radius:8px;width:100%;}
label{display:block;margin-top:12px;font-size:.9em;}

/* ===================== 前後測問卷 ===================== */
.qitem{border-bottom:1px solid var(--line);padding:16px 0;}
.qitem:last-child{border-bottom:none;}
.qitem .qt{margin-bottom:10px;line-height:1.75;}
.qitem .qt b{color:var(--accent);margin-right:6px;}
.lk{display:flex;gap:6px;flex-wrap:wrap;}
.lk.col{flex-direction:column;gap:8px;}
.lk label{flex:1 1 100px;margin:0;text-align:center;border:2px solid var(--line);border-radius:8px;
  padding:10px 6px;font-size:.72em;line-height:1.5;cursor:pointer;background:#fff;}
.lk.col label{flex:none;text-align:left;font-size:.8em;padding:13px 16px;}
.lk input{position:absolute;opacity:0;width:0;height:0;}
.lk label.sel{border-color:var(--accent);background:var(--accent2);font-weight:700;}
.svtitle{font-size:.8em;color:var(--sub);margin-bottom:4px;}
.svfoot{margin-top:18px;}

/* ===================== 情境模擬介面 ===================== */
.media{margin:16px 0;}
.phone{max-width:340px;margin:0 auto;border:9px solid #222;border-radius:26px;overflow:hidden;background:#8ba7c7;}
.line-bar{background:#3f5c76;color:#fff;padding:9px 13px;font-size:.72em;display:flex;align-items:center;gap:8px;}
.line-bar .av{width:26px;height:26px;border-radius:50%;background:#c9d6e2;flex:none;}
.line-body{padding:11px;min-height:120px;}
.lmsg{max-width:80%;margin:7px 0;padding:9px 13px;border-radius:16px;font-size:.72em;line-height:1.6;
      background:#fff;border-top-left-radius:4px;}
.ltime{font-size:.6em;color:#43596e;text-align:center;margin:5px 0;}

.smsbox{max-width:340px;margin:0 auto;border:9px solid #222;border-radius:26px;background:#fff;overflow:hidden;}
.sms-bar{background:#f2f2f5;padding:9px 13px;font-size:.68em;border-bottom:1px solid #ddd;text-align:center;}
.sms-body{padding:13px;}
.sbub{background:#e9e9eb;border-radius:16px;padding:11px 14px;font-size:.72em;line-height:1.65;}
.slink{color:#0a6ed1;text-decoration:underline;word-break:break-all;}

.appbox{max-width:340px;margin:0 auto;border:9px solid #222;border-radius:26px;background:#0e1621;color:#e8eef5;overflow:hidden;}
.app-bar{padding:11px 13px;font-size:.72em;background:#16202e;display:flex;justify-content:space-between;}
.app-body{padding:16px 13px;}
.app-big{font-size:1.5em;font-weight:700;color:#3ddc84;}
.app-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #24303f;font-size:.7em;}
.app-row .up{color:#3ddc84;}
.app-btn{margin-top:14px;background:#f0b429;color:#1a1a1a;text-align:center;padding:11px;
  border-radius:8px;font-weight:700;font-size:.75em;}

.docbox{max-width:380px;margin:0 auto;background:#fffdf5;border:1px solid #c9c2ae;padding:20px;
  font-size:.7em;line-height:1.9;}
.docbox h3{text-align:center;letter-spacing:4px;margin:0 0 12px;font-size:1.15em;}
.docbox .seal{float:right;width:72px;height:72px;border:3px solid #b3261e;color:#b3261e;border-radius:50%;
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:.68em;
  transform:rotate(-12deg);opacity:.85;margin:-6px 0 6px 6px;}

/* 教學用浮水印：截圖時會一併帶走，避免素材被拿去行騙 */
.fakemark{position:relative;}
.fakemark::after{content:"教學模擬畫面";position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;color:rgba(179,38,30,.26);
  font-size:1.3em;font-weight:800;letter-spacing:6px;transform:rotate(-22deg);pointer-events:none;}
</style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="brand">防詐練習網</div>
    <div class="fontctl">
      字級
      <button onclick="setFont(-2)" aria-label="縮小字級">A−</button>
      <button onclick="setFont(2)" aria-label="放大字級">A+</button>
    </div>
  </div>
</header>

<div class="progress">
  <div class="pg">
    <div>累積分數 <b id="pScore">0</b></div>
    <div><span class="tier" id="pTier">尚未分級</span></div>
    <div class="bar"><span id="pBar"></span></div>
    <div class="muted" id="pNext"></div>
  </div>
</div>

<div class="wrap" id="app"><div class="card"><p>載入中…</p></div></div>

<script>
/* =========================================================================

   2. 貼到下方 SB_URL 與 SB_KEY
   3. Authentication → Providers → 開啟「Anonymous sign-ins」
   4. SQL Editor 執行 supabase_schema.sql

   anon key 是設計來放在前端的公開金鑰，資料存取由資料庫的 RLS 政策控管，
   不要把 service_role key 放進這個檔案。
   ========================================================================= */
const SB_URL = 'https://ekiheayuqsmcdaedxpbw.supabase.co';
const SB_KEY = 'sb_publishable_Snv1OhdFcqkCehBz1DcRng_tmNacR9b';

const CONFIG = {
  gain: 10, loss: -4, perRound: 5,
  tiers: [
    { name:'防詐入門', min:0,   unlock:['tf'] },
    { name:'防詐進階', min:60,  unlock:['tf','trap'] },
    { name:'防詐高手', min:120, unlock:['tf','trap','sim'] },
    { name:'防詐達人', min:300, unlock:['tf','trap','sim'] }
  ]
};
const TYPE_NAME = { tf:'是非選擇題', trap:'陷阱題', sim:'情境模擬題' };
/* 人口變項。性別與教育程度之納入，依據于小軒[3]所述型態與族群之對應關係。
   各項均提供「不願提供」，避免因強制填答而排除受試者。 */
const AGE_GROUPS  = ['18 歲以下','19–30 歲','31–40 歲','41–50 歲','51–60 歲','61 歲以上','不願提供'];
const GENDERS     = ['男','女','其他','不願提供'];
const EDUCATIONS  = ['國中以下','高中職','專科或大學','研究所以上','不願提供'];
/* 防詐資訊關注頻率：作為練習量與成效關聯之控制變項（論文 3.4 節） */
const NEWS_FREQS  = ['從未','很少','有時','經常','幾乎每天','不願提供'];

/* =========================================================================
   前後測工具
   ------------------------------------------------------------------------
   ‧ 辨識測驗：A 卷用於前測、B 卷用於後測，兩卷為平行版本（題材對應、
     情境類型分布相同、難度相當）。測驗過程不提供正確答案與解析，
     以免前測本身成為介入而污染後測。
   ‧ 自我效能與受騙易感性量表題目取自 Chung & Yeung[9] 附錄。
     受騙易感性第 3 題為反向計分（於資料分析階段處理）。
   ‧ 使用者感受問卷五構面各兩題，末題為操弄檢核。
   ========================================================================= */

const POST_TEST_AT   = 30;   // 練習滿此題數後觸發後測
const FOLLOWUP_DAYS  = 14;
const RETURN_AT       = 10;  // 後測後回訪，累積練習滿此題數即跳出回訪回饋表單（每人一次）
const RETURN_MIN_DAYS = 1;   // 後測完成後至少隔幾天的作答才算「回訪」   // 後測後間隔此天數，回訪者才觸發追蹤測驗

/* 年齡層為「18 歲以下」者於前測第一部分須回答監護人同意題；
   選擇「尚未取得」者仍可作答與練習，但資料於分析時排除（見論文 3.2.1 節）；
   已滿 18 歲者選「不適用」。 */
const MINOR_AGE = '18 歲以下';
const isMinor = () => me && me.age_group === MINOR_AGE;

const LIKERT = ['非常不同意','不同意','普通','同意','非常同意'];

const TEST_FORMS = {
  A: [
    { scenario:'社會系統的信賴',
      q:'你收到一則簡訊：「【健保署】您的健保卡因異常使用已暫停，請於今日內至 nhi-gov-tw.info 完成驗證。」你會怎麼做？',
      options:['點連結完成驗證，以免影響就醫','不點連結，自行查健保署官方電話詢問','先回覆簡訊問是什麼異常'],
      answer:1 },
    { scenario:'誘之以利',
      q:'臉書廣告點進去是一個只有商品圖與下單欄位的網頁，沒有公司名稱、統編或客服電話，付款方式只有貨到付款。這個購物網站？',
      options:['貨到付款很安全，收到貨再付錢就好','風險很高，一頁式網站常用於販售劣質品或詐財','看評論數多不多再決定'],
      answer:1 },
    { scenario:'動之以情',
      q:'陌生號碼傳 LINE 給你：「媽我手機掉了，這是新號碼，先加我。我等下有筆錢要匯，可以先借我五萬嗎？」你的第一步是？',
      options:['先用原本存的號碼打給孩子本人確認','照新號碼回撥確認是不是本人','先借一部分，金額不大'],
      answer:0 },
    { scenario:'恫之以嚇',
      q:'電話中對方自稱檢察官，說你的帳戶涉及洗錢，要你把存款匯到「監管帳戶」以證明清白，並要求全程不要掛斷、不要告訴家人。這是？',
      options:['司法程序，應該配合','詐騙，司法機關沒有監管帳戶也不會這樣要求','先問清楚案號再決定'],
      answer:1 },
    { scenario:'誘之以利',
      q:'網路上看到「海外高薪工作，月薪十萬、免經驗、包機票食宿」，對方要你先寄提款卡與存摺過去「辦理薪轉」。你的判斷是？',
      options:['正常公司也需要帳戶匯薪水，可以寄','絕對不能寄，帳戶會被當作人頭戶，且有人身安全風險','先寄一張試試看'],
      answer:1 },
    { scenario:'社會系統的信賴',
      q:'你沒有網購，卻收到一件貨到付款的包裹，上面寫著你的姓名地址，金額 380 元。你應該？',

      answer:1 },
  ],
  B: [
    { scenario:'社會系統的信賴',
      q:'你收到一則簡訊：「【監理站】您有一筆交通罰單逾期未繳，請至 mvdis-gov.tw.cc 線上繳納，逾期加重處罰。」你會怎麼做？',
      options:['點連結繳費，免得加重處罰','不點連結，自行至監理服務網或臨櫃查詢','回覆簡訊詢問是哪一筆罰單'],
      answer:1 },
    { scenario:'誘之以利',
      q:'IG 廣告宣稱名牌包出清特價，點進去的網站商品圖片模糊、沒有退換貨說明，結帳頁要求填信用卡完整卡號與背面驗證碼。這個網站？',
      options:['特價品本來就便宜，可以買','高度可疑，資訊不全且索取完整卡片資料','先買便宜的試單看看'],

    { scenario:'動之以情',

      answer:1 },
    { scenario:'恫之以嚇',
      q:'電話中對方自稱通訊傳播委員會人員，說你的門號涉嫌發送詐騙簡訊，將為你轉接警方，並要求你「偵查不公開，不得告知任何家人」。這是？',

      answer:1 },
    { scenario:'誘之以利',
      q:'應徵打工時，對方說「為了確認你的財力與信用」，要求你提供存摺、提款卡與網路銀行密碼。你的判斷是？',

    { scenario:'社會系統的信賴',

const SCALE_SE = [

const UX_ITEMS = [

  ['分級機制感受','累積分數與等級，讓我更想繼續練習'],

/* ---------------- 全域狀態 ---------------- */
let sb = null;              // Supabase client
let online = false;         // 是否連上資料庫（僅在 true 時寫入受試者資料）
let reviewer = false;       // 以審核者帳號開啟時為 true：作答不寫入資料庫
let reviewerItems = null;   // 審核者預覽模式下讀取的已上架題目
let HIST = [];              // 本人逐題作答紀錄（複習回合用）：{ item_id, is_correct, created_at, session_id }
let SUB = null;             // 提醒信訂閱狀態
let me = null;              // { id, guest_code, age_group }
let P = { score:0, tier_idx:0, visits:0 };
let A = {};                 // 已完成的測驗：{ pre:{...}, post:{...}, followup:{...} }
let BANK = [];              // 題庫
let round = null;
let survey = null;          // 進行中的測驗狀態
const app = document.getElementById('app');

/* ---------------- 離線備援（localStorage） ---------------- */
let LKEY = 'antifraud_local_v2';   // 審核者預覽模式改用另一個儲存位置
function lsGet(){ try{ return JSON.parse(localStorage.getItem(LKEY)) || null; }catch(e){ return null; } }
function lsSet(o){ try{ localStorage.setItem(LKEY, JSON.stringify(o)); }catch(e){} }

/* ---------------- 啟動 ---------------- */
boot();

async function boot(){
  try{
    if(SB_URL.includes('你的專案') || SB_KEY.includes('貼上')){
      throw new Error('尚未填入 Supabase 連線設定');
    }
    sb = window.supabase.createClient(SB_URL, SB_KEY);

    // 提醒信中的取消訂閱連結：?unsub=代碼
    const unsub = new URLSearchParams(location.search).get('unsub');
    if(unsub){ return showUnsubscribe(unsub); }

    // 匿名登入：對應論文 3.2.3 節的訪客模式
    let { data:{ session } } = await sb.auth.getSession();
    // 研究者清除測試資料後，瀏覽器可能仍留著已被刪除帳號的登入狀態；
    // 向伺服器確認帳號仍存在，不存在則登出並重新建立匿名帳號。
    if(session){
      const { error:uerr } = await sb.auth.getUser();
      if(uerr){ await sb.auth.signOut(); session = null; }
    }
    if(!session){
      const { error } = await sb.auth.signInAnonymously();
      if(error) throw error;
      ({ data:{ session } } = await sb.auth.getSession());
    }
    const uid = session.user.id;

    // 審核者（以電子郵件登入的非匿名帳號）開啟練習網站時，
    // 仍讀取已上架題目供預覽，但不建立參與者、不寫入任何作答資料。
    if(session.user.is_anonymous === false || session.user.email){
      reviewer = true;
      const { data:items } = await sb.from('items').select('*').eq('status','approved');
      reviewerItems = items || [];
      throw new Error('審核者身分，改用預覽模式，作答不寫入資料庫');
    }

    // 建立或取得參與者資料
    let { data:part } = await sb.from('participants').select('*').eq('id', uid).maybeSingle();
    if(!part){
      const code = 'G-' + uid.slice(0,8).toUpperCase();
      const { data, error } = await sb.from('participants')
        .insert({ id:uid, guest_code:code, is_anonymous:true }).select().single();
      if(error) throw error;
      part = data;
      await sb.from('progress').insert({ participant_id:uid });
    }
    me = part;

    const { data:prog } = await sb.from('progress').select('*').eq('participant_id', uid).maybeSingle();
    if(prog) P = { score:prog.score, tier_idx:prog.tier_idx, visits:prog.visits,
                   cert_downloads:prog.cert_downloads || 0 };
    const { count } = await sb.from('responses')
      .select('id', { count:'exact', head:true }).eq('participant_id', uid);
    P.answered = count || 0;

    const { data:asmts } = await sb.from('assessments').select('*').eq('participant_id', uid);
    A = {};
    (asmts || []).forEach(a => { A[a.phase] = a; });

    const { data:hist } = await sb.from('responses')
      .select('item_id,is_correct,created_at,session_id').eq('participant_id', uid)
      .order('created_at', { ascending:true });
    HIST = hist || [];
    const { data:sub } = await sb.from('subscriptions').select('*').eq('participant_id', uid).maybeSingle();
    SUB = sub || null;

    const { data:items, error:ie } = await sb.from('items').select('*').eq('status','approved');
    if(ie) throw ie;
    BANK = (items || []).map(normalize);

    online = true;
  }catch(err){
    console.warn('改用離線模式：', err.message);
    online = false;
    if(reviewer){
      LKEY = 'antifraud_reviewer_preview';
      document.body.insertAdjacentHTML('afterbegin',
        '<div style="position:sticky;top:0;z-index:99;background:#b3261e;color:#fff;'
        + 'text-align:center;padding:10px 12px;font-weight:bold">目前為審核者身分，作答不會列入研究</div>');
    }
    const local = lsGet() || { guest_code:'L-'+Math.random().toString(36).slice(2,10).toUpperCase(),
                               score:0, tier_idx:0, visits:0, log:[] };
    lsSet(local);
    me = { id:null, guest_code:local.guest_code, age_group:local.age_group||null,
           gender:local.gender||null, education:local.education||null, news_freq:local.news_freq||null };
    P = { score:local.score, tier_idx:local.tier_idx, visits:local.visits,
          cert_downloads:local.cert_downloads || 0, answered:(local.log||[]).length };
    A = local.assessments || {};
    HIST = local.log || [];
    BANK = (reviewer && reviewerItems && reviewerItems.length)
      ? reviewerItems.map(normalize) : FALLBACK_BANK.map(normalize);
  }
  home();
}

function normalize(r){
  return {
    id:r.id, type:r.type, scenario:r.scenario, tactic:r.tactic||'', level:r.level||1,
    title:r.title||'', stem:r.stem||'',
    options: Array.isArray(r.options) ? r.options : (r.options ? JSON.parse(r.options) : []),
    answer:r.answer, explain:r.explain||'',
    rounds: Array.isArray(r.rounds) ? r.rounds : (r.rounds ? JSON.parse(r.rounds) : null),
    media: (typeof r.media === 'string') ? JSON.parse(r.media) : (r.media || null),
    approved_at: r.approved_at || null
  };
}

/* ---------------- 情境模擬介面渲染 ----------------
   media 物件格式：
     { kind:'line', title:'阿明（表哥）', time:'今天 14:32', msgs:[...] }
     { kind:'sms',  from:'+886 9XX-XXX-XXX', text:'...', link:'https://...' }
     { kind:'app',  name:'環球資產管理', total:'NT$ 1,247,860',
                    change:'今日 +38,420（+3.18%）', rows:[['外匯套利 A 組','+2.9%'],...],
                    btn:'立即出金' }
     { kind:'doc',  seal:'臺灣某地方檢察署', title:'監管命令書',
                    lines:['受文者：陳○○','案　號：...'], body:'...' }
   所有畫面均為虛構，不使用真實品牌與可連線之網域。
   --------------------------------------------------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function renderMedia(m){
  if(!m || !m.kind) return '';
  if(m.kind === 'line'){
    return '<div class="media"><div class="phone fakemark">'
      + '<div class="line-bar"><div class="av"></div><div>'+esc(m.title||'')+'</div></div>'
      + '<div class="line-body">'
      + (m.time ? '<div class="ltime">'+esc(m.time)+'</div>' : '')
      + (m.msgs||[]).map(t=>'<div class="lmsg">'+esc(t)+'</div>').join('')
      + '</div></div></div>';
  }
  if(m.kind === 'sms'){
    return '<div class="media"><div class="smsbox fakemark">'
      + '<div class="sms-bar">'+esc(m.from||'')+'</div>'
      + '<div class="sms-body"><div class="sbub">'+esc(m.text||'')
      + (m.link ? '<br><span class="slink">'+esc(m.link)+'</span>' : '')
      + '</div></div></div></div>';
  }
  if(m.kind === 'app'){
    return '<div class="media"><div class="appbox fakemark">'
      + '<div class="app-bar"><span>'+esc(m.name||'')+'</span><span>'+esc(m.time||'')+'</span></div>'
      + '<div class="app-body">'
      + '<div style="font-size:.68em;opacity:.7;">帳戶總值</div>'
      + '<div class="app-big">'+esc(m.total||'')+'</div>'
      + '<div style="font-size:.7em;color:#3ddc84;">'+esc(m.change||'')+'</div>'
      + '<div style="margin-top:14px;">'
      + (m.rows||[]).map(r=>'<div class="app-row"><span>'+esc(r[0])+'</span><span class="up">'+esc(r[1])+'</span></div>').join('')
      + '</div>'
      + (m.btn ? '<div class="app-btn">'+esc(m.btn)+'</div>' : '')
      + '</div></div></div>';
  }
  if(m.kind === 'doc'){
    return '<div class="media"><div class="docbox fakemark">'
      + (m.seal ? '<div class="seal">'+esc(m.seal)+'</div>' : '')
      + '<h3>'+esc(m.title||'')+'</h3>'
      + (m.lines||[]).map(l=>'<div>'+esc(l)+'</div>').join('')
      + '<div style="margin-top:10px;">'+esc(m.body||'')+'</div>'
      + '</div></div>';
  }
  return '';
}

/* ---------------- 進度列 ---------------- */
function tierOf(score){ let i=0; CONFIG.tiers.forEach((t,idx)=>{ if(score>=t.min) i=idx; }); return i; }
function unlockedTypes(){ return CONFIG.tiers[P.tier_idx].unlock; }

function renderProgress(){
  document.getElementById('pScore').textContent = P.score;
  document.getElementById('pTier').textContent = CONFIG.tiers[P.tier_idx].name;
  const next = CONFIG.tiers[P.tier_idx+1];
  const bar = document.getElementById('pBar');
  if(next){
    const base = CONFIG.tiers[P.tier_idx].min;
    bar.style.width = Math.min(100, Math.round((P.score-base)/(next.min-base)*100)) + '%';
    document.getElementById('pNext').textContent = '距離「'+next.name+'」還差 '+(next.min-P.score)+' 分';
  }else{
    bar.style.width='100%';
    document.getElementById('pNext').textContent='已達最高等級';
  }
}

async function addScore(correct){
  P.score += correct ? CONFIG.gain : CONFIG.loss;
  if(P.score < 0) P.score = 0;
  const t = tierOf(P.score);
  let promoted = false;
  if(t > P.tier_idx){ P.tier_idx = t; promoted = true; }   // 只升不降
  await persistProgress();
  return promoted;
}

async function persistProgress(){
  if(online){
    await sb.from('progress').update({
      score:P.score, tier_idx:P.tier_idx, visits:P.visits, updated_at:new Date().toISOString()
    }).eq('participant_id', me.id);
  }else{
    const l = lsGet(); Object.assign(l, P); lsSet(l);
  }
}

/* ---------------- 首頁 ---------------- */

  const unlocked = unlockedTypes();
  const rows = CONFIG.tiers.map((t,i)=>{
    const got = i <= P.tier_idx;
    return '<tr class="'+(got?'':'locked')+'"><td>'+t.name+'</td><td>'+t.min+' 分</td><td>'

    const sel = (id, arr) =>

      <div class="card">
        <h1>開始之前（第 1 步，共 2 步）</h1>
        <p>請先填寫四項基本資料。這些資料僅用於研究分析，不會用來識別任何個人，
           也不會與你的作答內容以外的資訊連結。</p>
        <label>年齡層${sel('ageSel', AGE_GROUPS)}</label>
        <label>性別${sel('genSel', GENDERS)}</label>
        <label>教育程度${sel('eduSel', EDUCATIONS)}</label>
        <label>過去一個月，你閱讀或觀看防詐相關新聞與宣導的頻率${sel('newsSel', NEWS_FREQS)}</label>
        <button class="main" onclick="saveProfile()">開始練習</button>
        <div id="profmsg" class="muted"></div>
      </div>
      ${online ? `<div class="card">
        <h2>之前用過這個網站？</h2>
        <p class="muted">換了手機或瀏覽器時，輸入之前設定的編號與 4 位數 PIN，就能接續原本的分數、等級與作答紀錄。</p>

    </div>

    <div class="card">
      <h2>審核者預覽模式</h2>
      <p class="muted">目前為審核者身分，作答不會列入研究。題目來自資料庫中已上架的題目，

    <div class="card">
      <h2>離線模式</h2>

    </div>`}
  `;
  renderProgress();
}

async function saveProfile(){
  const age = document.getElementById('ageSel').value;
  const gen = document.getElementById('genSel').value;
  const edu = document.getElementById('eduSel').value;
  const news = document.getElementById('newsSel').value;
  const msg = document.getElementById('profmsg');
  if(!age || !gen || !edu || !news){
    msg.textContent = '四項都請選擇。若不想提供，可選「不願提供」。';
    return;
  }
  me.age_group = age; me.gender = gen; me.education = edu; me.news_freq = news;
  if(online){
    await sb.from('participants')
      .update({ age_group:age, gender:gen, education:edu, news_freq:news }).eq('id', me.id);
  }else{
    const l = lsGet(); l.age_group=age; l.gender=gen; l.education=edu; l.news_freq=news; lsSet(l);
  }
  home();
}

/* ---------------- 前測、後測與追蹤測驗 ----------------
   前測在填完基本資料後、開始練習前施測；後測於累積練習達 POST_TEST_AT 題時觸發；
   追蹤測驗僅在後測完成滿 FOLLOWUP_DAYS 天後、參與者自行回訪時才出現。
   三個階段的辨識測驗一律不提供對錯回饋，避免測驗本身成為額外的學習介入。
   ------------------------------------------------------- */

const PHASE_META = {
  pre: {
    title: '開始之前（第 2 步，共 2 步）',
    intro: '在開始練習之前，想先了解你現在會怎麼判斷可疑的訊息。這份問卷沒有及格與不及格，'
         + '作答結果不會顯示對錯，也不會影響練習分數。大約需要三分鐘。',
    done:  '謝謝你，接下來就可以開始練習了。'
  },
  post: {
    title: '練習成果回饋',
    intro: '你已經完成一段練習。以下的問題用來了解練習前後的變化，以及你對這個網站的看法。'
         + '第三部分請依你實際的感受作答，不需要顧慮好聽與否。大約需要五分鐘。',
    done:  '謝謝你完成這份問卷，你的回答對這項研究很有幫助。之後仍然可以繼續練習與累積分數。'
  },
  followup: {
    title: '追蹤小測驗',
    intro: '距離你上次作答已經過了一段時間。想再請你花兩分鐘做一次相同形式的測驗，'
         + '用來了解學習效果能維持多久。',
    done:  '謝謝你回來，這份追蹤資料對研究很重要。'
  }
};

function otherForm(f){ return f === 'A' ? 'B' : 'A'; }

// 前測隨機分派 A 或 B 卷，後測使用另一卷，追蹤測驗沿用前測題本。
// 隨機分派可平衡兩份平行題本可能存在的難度差異。
function pickForm(phase){
  const pre = (A.pre && A.pre.form_version) || 'A';
  if(phase === 'pre')  return Math.random() < 0.5 ? 'A' : 'B';
  if(phase === 'post') return otherForm(pre);
  return pre;
}

function surveySteps(phase){
  return phase === 'post' ? ['rec','scale','ux'] : ['rec','scale'];
}

function startSurvey(phase){
  survey = { phase, form:pickForm(phase), step:0, t0:Date.now(),
             rec:[], se:[], sus:[], ux:[], noticed:null };
  renderSurvey();
}

// 點選後標示選中的選項，不依賴 CSS :has()，較舊的瀏覽器也能正常顯示
function lkMark(box){
  Array.prototype.forEach.call(box.querySelectorAll('label'), lb => {
    const inp = lb.querySelector('input');
    lb.classList.toggle('sel', !!(inp && inp.checked));
  });
}

function likertHTML(name, texts, startNo){
  return texts.map((t,i)=>
    '<div class="qitem"><div class="qt"><b>' + (startNo + i) + '.</b>' + esc(t) + '</div>'
    + '<div class="lk" oninput="lkMark(this)">'
    + LIKERT.map((L,k)=>'<label><input type="radio" name="'+name+i+'" value="'+(k+1)+'">'
        + '<span>'+L+'</span></label>').join('')
    + '</div></div>').join('');
}

function choiceHTML(name, texts, startNo){
  return texts.map((t,i)=>
    '<div class="qitem"><div class="qt"><b>' + (startNo + i) + '.</b>' + esc(t.q) + '</div>'
    + '<div class="lk col" oninput="lkMark(this)">'
    + t.options.map((o,j)=>'<label><input type="radio" name="'+name+i+'" value="'+j+'">'
        + '<span>'+esc(o)+'</span></label>').join('')
    + '</div></div>').join('');
}

function collect(prefix, n){
  const out = [];
  for(let i = 0; i < n; i++){
    const el = document.querySelector('input[name="'+prefix+i+'"]:checked');
    if(!el) return null;
    out.push(Number(el.value));
  }
  return out;
}

function renderSurvey(){
  const s = survey;
  const steps = surveySteps(s.phase);
  const key = steps[s.step];
  const meta = PHASE_META[s.phase];
  const last = s.step === steps.length - 1;
  let body = '';

  if(key === 'rec'){
    body = `
      <h2>第一部分　情境判斷</h2>
      <p class="muted">以下六題各描述一個情境，請選出你認為最合適的做法。
         這些題目不會顯示正確答案，請依照直覺作答即可。</p>
      ${(s.phase === 'pre' && isMinor()) ? `
      <div class="qitem">
        <div class="qt"><b>0.</b>若你未滿 18 歲，是否已取得父母或監護人同意，讓本研究收集你的作答資料？</div>
        <div class="lk col" oninput="lkMark(this)">
          <label><input type="radio" name="guardian" value="1"><span>已取得監護人同意收集資料</span></label>
          <label><input type="radio" name="guardian" value="0"><span>尚未取得（仍可作答與練習，但資料不會用於研究分析）</span></label>
          <label><input type="radio" name="guardian" value="na"><span>我已年滿 18 歲（不適用）</span></label>
        </div>
      </div>` : ''}
      ${choiceHTML('rec', TEST_FORMS[s.form], 1)}`;
  }else if(key === 'scale'){
    const n1 = SCALE_SE.length;
    body = `
      <h2>第二部分　自我評估</h2>
      <p class="muted">以下敘述請就你平常的情況作答，沒有標準答案。</p>
      ${likertHTML('se',  SCALE_SE,  1)}
      ${likertHTML('sus', SCALE_SUS, n1 + 1)}`;
  }else{
    const n = UX_ITEMS.length;
    body = `
      <h2>第三部分　使用感受</h2>
      <p class="muted">以下是關於這個網站本身的問題。</p>
      ${likertHTML('ux', UX_ITEMS.map(u=>u[1]), 1)}
      <div class="qitem">
        <div class="qt"><b>${n + 1}.</b>在練習的過程中，你有沒有注意到答對會累積分數、
          分數達到門檻可以取得證書並解鎖新的題型？</div>
        <div class="lk col" oninput="lkMark(this)">
          <label><input type="radio" name="noticed" value="1"><span>有注意到</span></label>
          <label><input type="radio" name="noticed" value="0"><span>沒有注意到</span></label>
        </div>
      </div>`;
  }

  app.innerHTML = `
    <div class="card">
      <div class="svtitle">${meta.title}　·　第 ${s.step + 1} 部分，共 ${steps.length} 部分</div>
      <h1>${key === 'rec' ? '請先回答幾個問題' : (key === 'scale' ? '關於你自己' : '關於這個網站')}</h1>
      ${s.step === 0 ? '<p>' + meta.intro + '</p>' : ''}
      ${body}
      <div class="svfoot">
        <button class="main" onclick="surveyNext()">${last ? '送出' : '下一部分'}</button>
        <div id="svmsg" class="muted"></div>
      </div>
    </div>`;
  renderProgress();
}

function surveyNext(){
  const s = survey;
  const steps = surveySteps(s.phase);
  const key = steps[s.step];
  const msg = document.getElementById('svmsg');

  if(key === 'rec'){
    const v = collect('rec', TEST_FORMS[s.form].length);
    if(!v){ msg.textContent = '還有題目沒有作答，六題都選好之後才能繼續。'; return; }
    if(s.phase === 'pre' && isMinor()){
      const g = document.querySelector('input[name="guardian"]:checked');
      if(!g){ msg.textContent = '請先回答第 0 題，選擇是否已取得監護人同意。'; return; }
      s.guardian = g.value === 'na' ? null : g.value === '1';
    }
    s.rec = v;
  }else if(key === 'scale'){
    const se  = collect('se',  SCALE_SE.length);
    const sus = collect('sus', SCALE_SUS.length);
    if(!se || !sus){ msg.textContent = '還有題目沒有作答，請全部選完再繼續。'; return; }
    s.se = se; s.sus = sus;
  }else{
    const ux = collect('ux', UX_ITEMS.length);
    const nt = document.querySelector('input[name="noticed"]:checked');
    if(!ux || !nt){ msg.textContent = '還有題目沒有作答，請全部選完再送出。'; return; }
    s.ux = ux; s.noticed = nt.value === '1';
  }

  if(s.step < steps.length - 1){
    s.step += 1;
    window.scrollTo(0, 0);
    renderSurvey();
  }else{
    submitSurvey();
  }
}

async function submitSurvey(){
  const s = survey;
  const items = TEST_FORMS[s.form];

  let score = 0;
  const detail = s.rec.map((pick, i) => {
    const ok = pick === items[i].answer;
    if(ok) score += 1;
    return { idx:i, scenario:items[i].scenario, pick, answer:items[i].answer, correct:ok };
  });

  const rec = {
    participant_id: me.id,
    phase: s.phase,
    form_version: s.form,
    recognition_score: score,
    recognition_detail: detail,
    self_efficacy: s.se,
    susceptibility: s.sus,
    ux_survey: s.phase === 'post' ? s.ux : null,
    noticed_mechanism: s.phase === 'post' ? s.noticed : null,
    guardian_consent: (s.phase === 'pre' && isMinor()) ? s.guardian : null,
    duration_ms: Date.now() - s.t0,
    created_at: new Date().toISOString()
  };

  const btn = document.querySelector('.svfoot button');
  if(btn){ btn.disabled = true; btn.textContent = '送出中…'; }

  if(online){
    const { data, error } = await sb.from('assessments')
      .upsert(rec, { onConflict:'participant_id,phase' }).select().single();
    if(error){
      console.warn('測驗儲存失敗：', error.message);
      const m = document.getElementById('svmsg');
      if(m) m.textContent = '送出時發生問題，請檢查網路後再按一次送出。';
      if(btn){ btn.disabled = false; btn.textContent = '送出'; }
      return;
    }
    A[s.phase] = data || rec;
  }else{
    const l = lsGet();
    l.assessments = l.assessments || {};
    l.assessments[s.phase] = rec;
    lsSet(l);
    A[s.phase] = rec;
  }

  const phase = s.phase;
  survey = null;
  window.scrollTo(0, 0);
  surveyDone(phase);
}

function surveyDone(phase){
  app.innerHTML = `
    <div class="card">
      <h1>已送出</h1>
      <p>${PHASE_META[phase].done}</p>
      <p class="muted">依研究設計，這幾題不提供對錯回饋，以免影響你後續的判斷。
         練習題的部分每一題答完都會附上解析。</p>
      <button class="main" onclick="home()">${phase === 'pre' ? '開始練習' : '回到首頁'}</button>
    </div>`;
  renderProgress();
}

/* ---------------- 證書圖片繪製 ----------------
   以 canvas 直接繪製，不依賴外部函式庫，也不受網頁排版影響。
   輸出 1200×840 的 PNG，可存檔或分享至社群與家庭群組。
   -------------------------------------------------- */
function drawCertificate(){
  const t = CONFIG.tiers[P.tier_idx];
  const W = 1200, H = 840;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';

  // 底色與外框
  g.fillStyle = '#fffdf7'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#12507e'; g.lineWidth = 10;
  g.strokeRect(28, 28, W - 56, H - 56);
  g.lineWidth = 3;
  g.strokeRect(48, 48, W - 96, H - 96);

  g.textAlign = 'center'; g.fillStyle = '#12507e';

  g.font = '600 34px ' + FONT;
  g.fillText('防詐意識分級證書', W / 2, 168);

  g.strokeStyle = '#c9d6e2'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(W / 2 - 200, 200); g.lineTo(W / 2 + 200, 200); g.stroke();

  g.font = '700 110px ' + FONT;
  g.fillText(t.name, W / 2, 350);

  g.fillStyle = '#333'; g.font = '28px ' + FONT;
  g.fillText('累積分數　' + P.score + ' 分', W / 2, 440);
  g.fillText('練習題數　' + (P.answered || '—') + ' 題', W / 2, 490);
  g.fillText('編　　號　' + me.guest_code, W / 2, 540);

  g.fillStyle = '#666'; g.font = '24px ' + FONT;
  g.fillText('核發日期　' + new Date().toLocaleDateString('zh-TW'), W / 2, 620);

  g.fillStyle = '#12507e'; g.font = '600 26px ' + FONT;
  g.fillText('防詐練習網', W / 2, 700);
  g.fillStyle = '#888'; g.font = '20px ' + FONT;
  g.fillText('本證書為學習成果紀錄，不代表任何官方資格認證', W / 2, 740);

  return c;
}

async function downloadCert(){
  const c = drawCertificate();

  a.href = c.toDataURL('image/png');
  a.download = '防詐意識分級證書_' + CONFIG.tiers[P.tier_idx].name + '_' + me.guest_code + '.png';
  a.click();

  // 記錄下載行為，作為證書機制是否誘發分享意願的行為指標

async function startRound(type){
  const pool = BANK.filter(q=>q.type===type);
  const picked = shuffle(pool.slice()).slice(0, CONFIG.perRound);
  round = { type, items:picked, i:0, correct:0, sessionId:null };
  P.visits += 1;
  if(online){
    const { data } = await sb.from('sessions')
      .insert({ participant_id:me.id, question_type:type }).select().single();
    if(data) round.sessionId = data.id;
  }
  await persistProgress();
  nextItem();
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function nextItem(){
  if(round.i >= round.items.length) return roundEnd();
  const q = round.items[round.i];
  if(q.type === 'sim') renderSim(q, 0); else renderSingle(q);
}

function renderSingle(q){
  app.innerHTML = `<div class="card">
    <p class="muted">第 ${round.i+1} / ${round.items.length} 題　·　${TYPE_NAME[q.type]}　·　${q.scenario}</p>
    <h2>${q.stem}</h2>
    ${renderMedia(q.media)}
    <div id="opts">${q.options.map((o,i)=>'<button class="opt" onclick="answerSingle('+i+')">'+o+'</button>').join('')}</div>
    <div id="fb"></div></div>`;
  renderProgress();
  round.itemStart = Date.now();
}

async function answerSingle(pick){
  const q = round.items[round.i];
  const ok = pick === q.answer;
  markOptions(pick, q.answer);
  await recordAnswer(q, pick, ok, null);
  const promoted = await addScore(ok);
  if(ok) round.correct++;
  document.getElementById('fb').innerHTML = `
    <div class="fb ${ok?'good':'bad'}">
      <div class="t">${ok ? '答對了　+'+CONFIG.gain+' 分' : '答錯了　'+CONFIG.loss+' 分'}</div>
      <div>${q.explain}</div>
      ${q.tactic ? '<p class="muted" style="margin-top:8px;">這題使用的話術：'+q.tactic+'</p>' : ''}
    </div>
    ${promoted ? '<div class="fb good"><div class="t">恭喜升級</div>你已取得「'+CONFIG.tiers[P.tier_idx].name+'」等級。</div>' : ''}
    <button class="main" onclick="advance()">下一題</button>`;
  renderProgress();
}

function renderSim(q, r){
  const rd = q.rounds[r];
  app.innerHTML = `<div class="card">
    <p class="muted">第 ${round.i+1} / ${round.items.length} 題　·　${TYPE_NAME[q.type]}　·　${q.scenario}　·　第 ${r+1} 幕（共 ${q.rounds.length} 幕）</p>
    <h2>${q.title}</h2>
    ${rd.media ? renderMedia(rd.media)
               : '<div class="chat">'+rd.chat.map(m=>'<div class="msg"><div class="who">'+m.who+'</div>'+m.text+'</div>').join('')+'</div>'}
    <p><b>${rd.q}</b></p>
    <div id="opts">${rd.options.map((o,i)=>'<button class="opt" onclick="answerSim('+r+','+i+')">'+o+'</button>').join('')}</div>
    <div id="fb"></div></div>`;
  renderProgress();
  round.itemStart = Date.now();
}

async function answerSim(r, pick){
  const q = round.items[round.i];
  const rd = q.rounds[r];
  const ok = pick === rd.answer;
  markOptions(pick, rd.answer);
  await recordAnswer(q, pick, ok, r);
  const promoted = await addScore(ok);
  if(ok) round.correct++;
  const last = (r === q.rounds.length - 1);
  document.getElementById('fb').innerHTML = `
    <div class="fb ${ok?'good':'bad'}">
      <div class="t">${ok ? '判斷正確　+'+CONFIG.gain+' 分' : '這樣做有風險　'+CONFIG.loss+' 分'}</div>
      <div>${rd.explain}</div>
    </div>
    ${promoted ? '<div class="fb good"><div class="t">恭喜升級</div>你已取得「'+CONFIG.tiers[P.tier_idx].name+'」等級。</div>' : ''}
    <button class="main" onclick="${last ? 'advance()' : 'renderSim(round.items[round.i],'+(r+1)+')'}">
      ${last ? '完成這個情境' : '看下一幕'}</button>`;
  renderProgress();
}

function markOptions(pick, ans){
  document.querySelectorAll('#opts .opt').forEach((b,i)=>{
    b.disabled = true;
    if(i === ans) b.classList.add('correct');
    else if(i === pick) b.classList.add('wrong');
  });
}

async function recordAnswer(q, pick, ok, sub){
  P.answered = (P.answered || 0) + 1;
  const rec = {
    participant_id: me.id, session_id: round.sessionId,
    item_id: q.id, sub_round: (sub===null? null : sub+1),
    item_type: q.type, scenario: q.scenario, tactic: q.tactic || null, level: q.level,
    chosen_index: pick, is_correct: ok,
    response_ms: Date.now() - (round.itemStart || Date.now()),
    created_at: new Date().toISOString()
  };
  HIST.push({ item_id:rec.item_id, is_correct:ok, created_at:rec.created_at, session_id:rec.session_id });
  if(online){ await sb.from('responses').insert(rec); }
  else { const l = lsGet(); l.log = l.log || []; l.log.push(rec); lsSet(l); }
}

function advance(){ round.i++; nextItem(); }

async function roundEnd(){
  const total = round.items.reduce((n,q)=> n + (q.type==='sim' ? q.rounds.length : 1), 0);
  const rate = Math.round(round.correct/total*100);
  if(online && round.sessionId){
    await sb.from('sessions').update({
      ended_at:new Date().toISOString(), items_count:total, correct_count:round.correct
    }).eq('id', round.sessionId);
  }
  app.innerHTML = `<div class="card">
    <h1>本回合完成</h1>
    <p>答對 ${round.correct} 題，正確率 ${rate}%。</p>
    <p>目前累積 <b>${P.score}</b> 分，等級為「${CONFIG.tiers[P.tier_idx].name}」。</p>
    ${(!A.post && (P.answered||0) >= POST_TEST_AT)
      ? '<p class="muted">你已完成 '+P.answered+' 題練習。回到首頁時，會請你填寫一份約五分鐘的問卷。</p>' : ''}
    <button class="main" onclick="home()">回到首頁</button>
    <button class="main ghost" onclick="showCert()">查看證書</button></div>`;
  renderProgress();
}

function showCert(){

}

    no_pin:'這個編號之前沒有設定 PIN，無法找回。',
    wrong_pin:'PIN 不正確。連續輸錯 5 次會暫停 30 分鐘。',
    locked:'輸錯次數過多，請 30 分鐘後再試。',
    same:'這台裝置已經是這個編號了。',
    new_has_data:'這台裝置已經開始作答，無法再合併其他編號的紀錄。',
    bad_input:'請輸入編號與 4 位數 PIN。'
  }[data] || '發生問題，請稍後再試。';
  msg.textContent = text;
  if(data === 'ok') setTimeout(() => location.reload(), 900);
}

/* =========================================================================
   每月提醒信訂閱（自願，18 歲以下不提供）
   寄信由研究者電腦上的 send_reminders.py 每月執行一次。
   ========================================================================= */
function subscribeCard(){
  if(me.age_group === MINOR_AGE) return '';
  const active = SUB && !SUB.unsubscribed_at;
  if(active){
    return `<div class="card">
      <h2>每月新題目提醒</h2>
      <p>已訂閱，提醒信會寄到 <b>${esc(SUB.email)}</b>。</p>
      <button class="main ghost" onclick="unsubscribeSelf()">取消訂閱</button>
      <div id="submsg" class="muted"></div></div>`;
  }
  return `<div class="card">
    <h2>每月新題目提醒（自願）</h2>
    <p>題庫每週都會加入新的詐騙手法。留下 email，每月會收到一封提醒信，告訴你有幾題新題目可以練習。</p>
    <label>Email<input id="subemail" type="email" autocomplete="email"></label>
    <label class="chkline"><input type="checkbox" id="subok">
      我同意本研究以此 email 每月寄送一次新題目提醒。email 只用於寄送提醒，不會與作答內容一起分析，可隨時取消。</label>
    <button class="main" onclick="subscribe()">訂閱提醒</button>
    <div id="submsg" class="muted"></div></div>`;
}

async function subscribe(){
  const email = document.getElementById('subemail').value.trim();
  const ok = document.getElementById('subok').checked;
  const msg = document.getElementById('submsg');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg.textContent = '請輸入正確的 email。'; return; }
  if(!ok){ msg.textContent = '請勾選同意後再訂閱。'; return; }
  const rec = { participant_id:me.id, email, consented_at:new Date().toISOString(), unsubscribed_at:null };
  const { data, error } = await sb.from('subscriptions')
    .upsert(rec, { onConflict:'participant_id' }).select().single();
  if(error){ msg.textContent = '訂閱失敗，請稍後再試。'; return; }
  SUB = data;
  home();
}

async function unsubscribeSelf(){
  const { error } = await sb.from('subscriptions')
    .update({ unsubscribed_at:new Date().toISOString() }).eq('participant_id', me.id);
  if(error){ document.getElementById('submsg').textContent = '取消失敗，請稍後再試。'; return; }
  SUB.unsubscribed_at = new Date().toISOString();
  home();
}

async function showUnsubscribe(token){
  app.innerHTML = '<div class="card"><p>處理中…</p></div>';
  const { data, error } = await sb.rpc('unsubscribe', { p_token:token });
  const ok = !error && data === 'ok';
  app.innerHTML = `<div class="card">
    <h1>${ok ? '已取消訂閱' : '這個連結已失效'}</h1>
    <p>${ok ? '之後不會再寄送提醒信給你。歡迎隨時回來練習。' : '可能已經取消過了，或連結不完整。'}</p>
    <button class="main" onclick="location.href=location.pathname">前往練習網站</button></div>`;
}

/* =========================================================================
   複習回合：上次答錯的題目優先，不足五題時補上還沒做過的新題目
   ‧ 「答錯」以該題最近一次作答為準；情境模擬題任一幕答錯即視為答錯。
   ‧ 只納入目前等級已解鎖的題型。
   ‧ 複習回合屬練習的一部分，計分方式相同；前後測與追蹤測驗仍使用固定題本。
   ========================================================================= */
function reviewPool(){
  const unlocked = unlockedTypes();
  const usable = BANK.filter(q => unlocked.includes(q.type));
  const byItem = {};
  HIST.forEach(h => { (byItem[h.item_id] = byItem[h.item_id] || []).push(h); });
  const wrong = [], fresh = [];
  usable.forEach(q => {
    const recs = byItem[q.id];
    if(!recs){ fresh.push(q); return; }
    const k = q.type === 'sim' ? (q.rounds ? q.rounds.length : 1) : 1;
    if(recs.slice(-k).some(h => !h.is_correct)) wrong.push(q);
  });
  fresh.sort((a,b) => String(b.approved_at||'').localeCompare(String(a.approved_at||'')));
  return { wrong, fresh };
}

function reviewHtml(){
  if(!HIST.length) return '';
  const { wrong, fresh } = reviewPool();
  if(!wrong.length && !fresh.length) return '';
  const nW = Math.min(wrong.length, CONFIG.perRound);
  const nF = Math.min(fresh.length, CONFIG.perRound - nW);
  return `<div class="review">
    <b>複習回合</b>　上次答錯的 ${nW} 題${nF ? '＋還沒做過的新題目 '+nF+' 題' : ''}
    <button class="main" onclick="startReview()">開始複習</button></div>`;
}

async function startReview(){
  const { wrong, fresh } = reviewPool();
  const picked = shuffle(wrong.slice()).slice(0, CONFIG.perRound);
  fresh.slice(0, CONFIG.perRound - picked.length).forEach(q => picked.push(q));
  if(!picked.length) return home();
  round = { type:'review', items:shuffle(picked), i:0, correct:0, sessionId:null };
  P.visits += 1;
  if(online){
    const { data } = await sb.from('sessions')
      .insert({ participant_id:me.id, question_type:'review' }).select().single();
    if(data) round.sessionId = data.id;
  }
  await persistProgress();
  nextItem();
}

/* =========================================================================
   回訪回饋表單（論文 3.4、3.5 節）
   ‧ 對象：完成後測後又回訪的受試者；回訪練習滿 RETURN_AT 題時出現，每人一次。
   ‧ 自評保留僅作為自覺指標，能力是否保留以追蹤測驗之辨識得分為準。
   ========================================================================= */
const RETURN_ITEMS = [
  '和上次練習相比，我仍記得如何辨認詐騙訊息中的線索。',
  '這次練習讓我認識了之前不知道的詐騙手法。',
  '重做上次答錯的題目，幫助我弄清楚當初判斷錯在哪裡。',
  '上次練習後，我在生活中遇到可疑訊息時，曾想起網站上學到的判斷方法。',
  '上次練習後，我曾提醒家人或朋友注意某種詐騙手法。',
  '我願意每個月回來練習一次。'
];
const RETURN_REASONS = ['收到提醒信','想看新題目','想提升等級','想再確認自己的判斷力','其他'];

function returnCount(){
  if(!A.post || !A.post.created_at) return 0;
  const from = new Date(A.post.created_at).getTime() + RETURN_MIN_DAYS * 86400000;
  return HIST.filter(h => h.created_at && new Date(h.created_at).getTime() >= from).length;
}

function renderReturn(){
  survey = { phase:'return', t0:Date.now() };
  app.innerHTML = `<div class="card">
    <div class="svtitle">回訪回饋</div>
    <h1>歡迎回來，想聽聽你的感受</h1>
    <p>謝謝你回來練習。以下幾題想了解這段時間的學習情形，約一分鐘可以完成，沒有標準答案。</p>
    ${likertHTML('rt', RETURN_ITEMS, 1)}
    <div class="qitem">
      <div class="qt"><b>${RETURN_ITEMS.length + 1}.</b>這次回來練習的原因是什麼？（可複選）</div>
      <div class="lk col" oninput="lkMark(this)">
        ${RETURN_REASONS.map((r,i)=>'<label><input type="checkbox" name="rr" value="'+i+'"><span>'+r+'</span></label>').join('')}
      </div>
    </div>
    <div class="qitem">
      <div class="qt"><b>${RETURN_ITEMS.length + 2}.</b>這次回來練習，你覺得最有幫助或最需要改進的是什麼？（選填）</div>
      <textarea id="rtopen" rows="3" style="width:100%"></textarea>
    </div>
    <div class="svfoot">
      <button class="main" onclick="submitReturn()">送出</button>
      <div id="svmsg" class="muted"></div>
    </div></div>`;
  renderProgress();
}

async function submitReturn(){
  const msg = document.getElementById('svmsg');
  const lk = collect('rt', RETURN_ITEMS.length);
  const reasons = [...document.querySelectorAll('input[name="rr"]:checked')].map(x => RETURN_REASONS[Number(x.value)]);
  if(!lk){ msg.textContent = '還有題目沒有作答，請全部選完再送出。'; return; }
  if(!reasons.length){ msg.textContent = '請至少勾選一個回來練習的原因。'; return; }
  const rec = {
    participant_id: me.id,
    phase: 'return',
    return_survey: lk,
    return_reasons: reasons,
    open_comment: document.getElementById('rtopen').value.trim() || null,
    duration_ms: Date.now() - survey.t0,
    created_at: new Date().toISOString()
  };
  const btn = document.querySelector('.svfoot button');
  if(btn){ btn.disabled = true; btn.textContent = '送出中…'; }
  if(online){
    const { data, error } = await sb.from('assessments')
      .upsert(rec, { onConflict:'participant_id,phase' }).select().single();
    if(error){
      console.warn('回饋儲存失敗：', error.message);
      msg.textContent = '送出時發生問題，請檢查網路後再按一次送出。';
      if(btn){ btn.disabled = false; btn.textContent = '送出'; }
      return;
    }
    A['return'] = data || rec;
  }else{
    const l = lsGet(); l.assessments = l.assessments || {}; l.assessments['return'] = rec; lsSet(l);
    A['return'] = rec;
  }
  survey = null;
  window.scrollTo(0, 0);
  app.innerHTML = `<div class="card"><h1>謝謝你的回饋</h1>
    <p>你的意見會用來改進題庫與網站。之後仍可繼續練習。</p>
    <button class="main" onclick="home()">回到首頁</button></div>`;
}
