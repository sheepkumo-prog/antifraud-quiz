<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>題庫審核後台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--accent:#12507e;--line:#d5dbe0;--ok:#0a7a3d;--okbg:#e6f5ec;--bad:#b3261e;--badbg:#fdecea;--sub:#666;}
*{box-sizing:border-box;}
body{margin:0;background:#f4f6f8;font-family:"Microsoft JhengHei","PingFang TC",sans-serif;
     font-size:16px;line-height:1.8;color:#1a1a1a;}
header{background:var(--accent);color:#fff;padding:12px 0;}
.hd{max-width:960px;margin:0 auto;padding:0 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.hd b{font-size:1.1em;}
.wrap{max-width:960px;margin:0 auto;padding:18px 16px 80px;}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0;}
.muted{color:var(--sub);font-size:.85em;}
button{font-family:inherit;font-size:.92em;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;}
.b-ok{background:var(--ok);color:#fff;} .b-no{background:var(--bad);color:#fff;}
.b-gh{background:#fff;color:var(--accent);border:2px solid var(--accent);}
.b-del{background:#fff;color:var(--bad);border:2px solid var(--bad);margin-left:auto;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.tabs button{background:#fff;color:var(--accent);border:2px solid var(--line);padding:6px 14px;}
.tabs button.on{border-color:var(--accent);background:#e8f0f7;font-weight:bold;}
.b-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center;}
input,textarea,select{font-family:inherit;font-size:.92em;padding:9px;border:2px solid var(--line);
  border-radius:6px;width:100%;}
textarea{min-height:70px;}
.tag{display:inline-block;background:#e8f0f7;color:var(--accent);border-radius:14px;
  padding:2px 12px;font-size:.78em;margin-right:6px;}
.opt{border:2px solid var(--line);border-radius:8px;padding:9px 13px;margin:6px 0;font-size:.92em;}
.opt.ans{border-color:var(--ok);background:var(--okbg);}
.chk{background:#fff8e6;border-left:6px solid #f0b429;padding:12px 14px;border-radius:6px;margin:12px 0;font-size:.88em;}
.chk ul{margin:6px 0 0;padding-left:20px;}
.scene{background:#eef1f4;border-radius:8px;padding:12px;margin:10px 0;font-size:.86em;}
.scene .k{color:var(--sub);font-size:.85em;}
.empty{text-align:center;padding:60px 20px;color:var(--sub);}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;}
.on{background:#7ee2a8;} .off{background:#f0a5a0;}
hr{border:none;border-top:1px solid var(--line);margin:14px 0;}
</style>
</head>
<body>
<header><div class="hd">
  <b>題庫審核後台</b>
  <span id="stat" class="muted" style="color:#dce8f2;"></span>
  <span style="margin-left:auto;"><button class="b-gh" onclick="load()">重新整理</button></span>
</div></header>

<div class="wrap" id="app"><div class="card">載入中…</div></div>

<script>
/* ====================================================================
   題庫審核後台
   --------------------------------------------------------------------
   對應論文 2.4.3 節之四道把關程序，由研究者逐題檢核後決定上架與否。

   設定：填入與網站前台相同的 Supabase 專案網址與 publishable key。
   注意：本頁使用一般權限金鑰，需先以研究者帳號登入。
        請在 Supabase 建立一組研究者帳號，並執行 02_審核者權限.sql
        授予該帳號讀寫 items 的權限。
   ==================================================================== */
const SB_URL = 'https://ekiheayuqsmcdaedxpbw.supabase.co';
const SB_KEY = 'sb_publishable_Snv1OhdFcqkCehBz1DcRng_tmNacR9b';

const TYPE={tf:'是非選擇題',trap:'陷阱題',sim:'情境模擬題'};
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const app = document.getElementById('app');
let rows = [];
let view = 'draft';   // 目前檢視的狀態：draft 待審、approved 已上架、retired 已退回或下架
const VIEW_NAME = { draft:'待審', approved:'已上架', retired:'已退回／下架' };

init();

async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session || session.user.is_anonymous){ return loginForm(); }
  document.getElementById('stat').innerHTML =
    '<span class="dot on"></span>' + session.user.email;
  load();
}

function loginForm(){
  app.innerHTML = `<div class="card" style="max-width:420px;margin:40px auto;">
    <h3>研究者登入</h3>
    <p class="muted">請使用你在 Supabase 建立的研究者帳號登入。</p>
    <label>電子郵件<input id="em" type="email"></label>
    <label style="display:block;margin-top:10px;">密碼<input id="pw" type="password"></label>
    <div class="b-row"><button class="b-ok" onclick="doLogin()">登入</button></div>
    <div id="msg" class="muted"></div></div>`;
}

async function doLogin(){
  const email=document.getElementById('em').value.trim();
  const password=document.getElementById('pw').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ document.getElementById('msg').textContent='登入失敗：'+error.message; return; }
  init();
}

async function load(){
  app.innerHTML = '<div class="card">載入中…</div>';
  const { data, error } = await sb.from('items').select('*')
    .eq('status', view).order('generated_at',{ascending:false});
  if(error){ app.innerHTML='<div class="card">讀取失敗：'+error.message+'</div>'; return; }
  rows = data || [];
  render();
}

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function mediaPreview(m){
  if(!m) return '<span class="muted">（無模擬畫面）</span>';
  const k={line:'通訊軟體對話',sms:'簡訊',app:'應用程式畫面',doc:'公文'}[m.kind]||m.kind;
  let inner='';
  if(m.kind==='line') inner=(m.msgs||[]).map(t=>'· '+esc(t)).join('<br>');
  else if(m.kind==='sms') inner=esc(m.text||'')+(m.link?'<br>連結：'+esc(m.link):'');
  else if(m.kind==='app') inner=esc(m.name||'')+'　'+esc(m.total||'')+'　'+esc(m.change||'');
  else if(m.kind==='doc') inner=esc(m.title||'')+'<br>'+esc(m.body||'').slice(0,120);
  return '<div class="scene"><div class="k">模擬畫面：'+k+'</div>'+inner+'</div>';
}

function optBlock(opts, ans){
  return (opts||[]).map((o,i)=>
    '<div class="opt'+(i===ans?' ans':'')+'">'+(i===ans?'✔ ':'')+esc(o)+'</div>').join('');
}

function tabsHtml(){
  return '<div class="tabs">' + Object.keys(VIEW_NAME).map(k =>
    '<button class="'+(k===view?'on':'')+'" onclick="switchView(\''+k+'\')">'+VIEW_NAME[k]+'</button>'
  ).join('') + '</div>';
}

function switchView(v){ view = v; load(); }

function render(){
  const tip = {
    draft:'請逐題檢核事實正確性、答案唯一性、解析完整性與誘答選項有效性。',
    approved:'目前在練習網站上出題的題目。發現問題時可下架；尚無人作答的題目也可直接刪除。',
    retired:'退回或下架的題目。其審核備註會作為後續生成的負面示範，刪除後該示範也會一併消失。'
  }[view];
  if(!rows.length){
    app.innerHTML = '<div class="card">'+tabsHtml()+'</div>'
      + '<div class="card empty"><h3>目前沒有'+VIEW_NAME[view]+'的題目</h3>'
      + (view==='draft' ? '<p>題庫生成程式由排程定期執行，執行後新題目會出現在這裡。</p>' : '')
      + '</div>';
    return;
  }
  app.innerHTML = '<div class="card">'+tabsHtml()
    + '<p><b>'+VIEW_NAME[view]+' '+rows.length+' 題</b></p>'
    + '<p class="muted">'+tip+'</p></div>'
    + rows.map(cardHtml).join('');
}

function cardHtml(r){
  const body = r.type==='sim'
    ? (r.rounds||[]).map((rd,i)=>
        '<hr><div class="muted">第 '+(i+1)+' 幕</div>'
        + mediaPreview(rd.media)
        + '<p><b>'+esc(rd.q)+'</b></p>'+optBlock(rd.options, rd.answer)
        + '<p class="muted">解析：'+esc(rd.explain)+'</p>').join('')
    : mediaPreview(r.media)
      + '<p><b>'+esc(r.stem)+'</b></p>'+optBlock(r.options, r.answer)
      + '<p class="muted">解析：'+esc(r.explain)+'</p>';

  return `<div class="card" id="c-${r.id}">
    <div>
      <span class="tag">${TYPE[r.type]||r.type}</span>
      <span class="tag">${esc(r.scenario)}</span>
      ${r.tactic?'<span class="tag">'+esc(r.tactic)+'</span>':''}
      <span class="tag">難度 ${r.level}</span>
    </div>
    <p class="muted">${esc(r.id)}　·　${esc(r.source_note||'')}</p>
    ${r.title?'<h3>'+esc(r.title)+'</h3>':''}
    ${body}
    ${r.review_note ? '<p class="muted">審核備註：'+esc(r.review_note)+'</p>' : ''}
    ${view!=='draft' ? '' : `<div class="chk"><b>審核檢核點</b><ul>
      <li>題幹所述手法是否確實存在？應對建議是否正確（申訴管道、報案程序）？</li>
      <li>題幹是否足以唯一決定正確答案，沒有第二種合理解讀？</li>
      <li>兩個誘答選項是否為真實的人可能犯的錯誤，而非明顯荒謬？</li>
      <li>解析是否說明了可辨識的線索，而不只是斷言「這是詐騙」？</li>
      <li>模擬畫面是否使用虛構機構名稱與不可連線的網址？</li>
    </ul></div>`}
    ${view==='retired' ? '' : `<label>${view==='draft'?'審核備註（選填）':'下架原因（選填）'}<input id="n-${r.id}" placeholder="${view==='draft'?'例如：修正申訴管道說法':'例如：發現申訴管道說法有誤'}"></label>`}
    <div class="b-row">
      ${view==='draft' ? `<button class="b-ok" onclick="decide('${r.id}','approved')">通過並上架</button>
      <button class="b-no" onclick="decide('${r.id}','retired')">退回不採用</button>` : ''}
      ${view==='approved' ? `<button class="b-no" onclick="decide('${r.id}','retired')">下架</button>` : ''}
      <span class="muted" id="m-${r.id}"></span>
      <button class="b-del" onclick="removeItem('${r.id}')">刪除題目</button>
    </div>
  </div>`;
}

async function decide(id, status){
  const note = (document.getElementById('n-'+id)||{}).value || null;
  const now = new Date().toISOString();
  const patch = { status, reviewed_at: now, review_note: note };
  if(status==='approved') patch.approved_at = now;
  const { error } = await sb.from('items').update(patch).eq('id', id);
  const msg = document.getElementById('m-'+id);
  if(error){ msg.textContent = '失敗：'+error.message; return; }
  const el = document.getElementById('c-'+id);
  el.style.opacity = .45;
  msg.textContent = status==='approved' ? '已上架' : (view==='approved' ? '已下架' : '已退回');
  rows = rows.filter(r=>r.id!==id);
  setTimeout(()=>{ el.remove(); if(!rows.length) render(); }, 700);
}

/* 刪除題目：呼叫資料庫函式 delete_item（見 pipeline/11_審核者刪除題目.sql）。
   已有受試者作答的題目不允許刪除，以免逐題作答紀錄失去對應題目而影響項目分析；
   這類題目請改用「下架」。 */
async function removeItem(id){
  const r = rows.find(x => x.id === id);
  const label = (r && (r.title || r.stem) || id).slice(0, 40);
  if(!confirm('確定要永久刪除這一題嗎？刪除後無法復原。\n\n' + label)) return;
  const msg = document.getElementById('m-'+id);
  msg.textContent = '刪除中…';
  const { data, error } = await sb.rpc('delete_item', { p_id: id });
  if(error){ msg.textContent = '刪除失敗：'+error.message; return; }
  if(typeof data === 'string' && data.startsWith('has_responses:')){
    msg.textContent = '已有 '+data.split(':')[1]+' 筆作答紀錄，刪除會影響項目分析，請改用「下架」。';
    return;
  }
  const el = document.getElementById('c-'+id);
  el.style.opacity = .45;
  msg.textContent = data === 'not_found' ? '找不到這一題，可能已被刪除。' : '已刪除';
  rows = rows.filter(x => x.id !== id);
  setTimeout(()=>{ el.remove(); if(!rows.length) render(); }, 700);
}
</script>
</body>
</html>
